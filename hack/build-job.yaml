# Parameterized BuildKit build Job.
#
# Rendered by hack/build-cluster.sh, which is called from
# `make build BUILD_TARGET=<kubectl-context>`; never applied by hand.
#
# This file lives outside k8s/ on purpose: k8s/Makefile applies every *.yaml
# under k8s/, so a template kept there would be adopted as deploy state.
#
# Template tokens:
#   __JOB_NAME__           Job name, derived from __TAG__ and sanitized for DNS
#   __REPO_URL__           git URL to clone
#   __REF__                git ref (branch, tag or commit) to build
#   __TAG__                image tag to push
#   __DOCKERFILE__         Dockerfile path inside the repository
#   __IMAGE__              target image repository, without tag
#   __PUSH__               "true" to push the built image
#   __PUSH_SECRET__        name of the dockerconfigjson secret to mount
#   __DEADLINE_SECONDS__   Job deadline in seconds
#   __SOURCE_DATE_EPOCH__  commit timestamp, decimal seconds
#   __SERVICE_PATH__       repository-relative service path, recorded as an
#                          annotation so a fan-out can be verified from the
#                          cluster (a Job name is DNS-1123 and cannot carry `/`)
#   __CONTEXT_PATH__       BuildKit context local; `/src` for a single-service
#                          repository, `/src/<subdir>` for a monorepo service
#   __DOCKERFILE_PATH__    BuildKit dockerfile local; matches __CONTEXT_PATH__
#                          so that the plain `Dockerfile` name stays valid
#   __NODE_SELECTOR__      hostname to pin builds to, when the cluster has an
#                          untainted control plane worth keeping clear of builds.
#                          The launcher DELETES the whole nodeSelector line when
#                          this is empty, so an unset token means "no selector"
#                          rather than `nodeSelector: {}`.
#   __NAMESPACE__          namespace to create the Job in
#   __CACHE_REF__          registry ref for the BuildKit cache, `<image>:buildcache`
#                          by default; a fan-out may point several images at one
#                          shared cache instead
#
# All four build args are emitted unconditionally: BuildKit ignores a build-arg
# the Dockerfile does not consume, so one template serves a repository that
# reads BUILD_GIT_VERSION/SOURCE_DATE_EPOCH and one that reads
# BUILD_GIT_COMMIT/BUILD_DATE without either having to diverge.
#
# The build cache is exported to and imported from __CACHE_REF__ in the
# target registry (`<image>:buildcache` unless the launcher overrides it),
# because BuildKit state lives on an emptyDir and nothing
# survives the Job otherwise. That is what makes the Dockerfile's split
# `go mod download` layer worth having: without a remote cache the module
# download is paid in full on every build. mode=max is required — the default
# exports only the final image's layers, not the intermediate ones the download
# step produces. The first build imports nothing and BuildKit treats that as a
# cache miss rather than an error.
#
# Prerequisite (not created by this manifest): a kubernetes.io/dockerconfigjson
# secret in the build namespace, named by __PUSH_SECRET__, holding a credential
# that may push to the target registry.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  annotations:
    build.benjamin-borbe.de/service: "__SERVICE_PATH__"
  labels:
    app.kubernetes.io/name: image-build
    app.kubernetes.io/component: build
    app.kubernetes.io/version: "__TAG__"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: __DEADLINE_SECONDS__
  # Long enough to read the digest out of the finished Job's logs, short enough
  # that finished Jobs do not pile up: a label list over this namespace is the
  # dedupe surface for every build producer, and a day of finished Jobs makes
  # every such list a mix of live and dead. The Job name carries a run id, so
  # releasing the name is no longer the reason — retaining the logs is.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-build
        app.kubernetes.io/component: build
        app.kubernetes.io/version: "__TAG__"
    spec:
      restartPolicy: Never
      nodeSelector: {kubernetes.io/hostname: __NODE_SELECTOR__}
      initContainers:
        - name: clone
          image: alpine/git:v2.54.0@sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              git init -q /src
              git -C /src remote add origin "$1"
              git -C /src fetch -q --depth=1 --tags origin "$2"
              git -C /src checkout -q --detach FETCH_HEAD
              git -C /src log -1 --format=%ct > /meta/source-date-epoch
              git -C /src describe --tags --always --dirty > /meta/git-version
              git -C /src rev-parse --short HEAD > /meta/git-commit
              git -C /src log -1 --format=%cI > /meta/build-date
              echo "cloned $1 at $2: $(git -C /src rev-parse HEAD) epoch=$(cat /meta/source-date-epoch) version=$(cat /meta/git-version) commit=$(cat /meta/git-commit)"
            - clone
            - "__REPO_URL__"
            - "__REF__"
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: /src
          # requests == limits, so the scheduler itself bounds concurrency
          # instead of a separate throttle: 16 CPU / 2 CPU per build = 8 in
          # flight. A request below the limit lets the node overcommit and the
          # build then dies on memory rather than waiting for a slot.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: src
              mountPath: /src
            - name: meta
              mountPath: /meta
      containers:
        - name: build
          image: moby/buildkit:v0.34.1-rootless@sha256:f68752a5a94acfcdad2d07867b7075601a421638e17fc5f28efc1c814d0c4f89
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cloned_epoch="$(cat /meta/source-date-epoch)"
              if [ "${cloned_epoch}" != "__SOURCE_DATE_EPOCH__" ]; then
                echo "REF __REF__ is commit epoch ${cloned_epoch} in the cluster but __SOURCE_DATE_EPOCH__ in the local repository; run git fetch and retry" >&2
                exit 1
              fi
              buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local context=__CONTEXT_PATH__ \
                --local dockerfile=__DOCKERFILE_PATH__ \
                --opt filename=__DOCKERFILE__ \
                --opt platform=linux/amd64 \
                --opt build-arg:SOURCE_DATE_EPOCH=__SOURCE_DATE_EPOCH__ \
                --opt build-arg:BUILD_GIT_VERSION="$(cat /meta/git-version)" \
                --opt build-arg:BUILD_GIT_COMMIT="$(cat /meta/git-commit)" \
                --opt build-arg:BUILD_DATE="$(cat /meta/build-date)" \
                --metadata-file /meta/metadata.json \
                --export-cache type=registry,ref=__CACHE_REF__,mode=max \
                --import-cache type=registry,ref=__CACHE_REF__ \
                --output type=image,name=__IMAGE__:__TAG__,push=__PUSH__,rewrite-timestamp=true
              cat /meta/metadata.json
          env:
            - name: BUILDKITD_FLAGS
              value: "--oci-worker-no-process-sandbox"
            - name: DOCKER_CONFIG
              value: "/docker-config"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: src
              mountPath: /src
            - name: meta
              mountPath: /meta
            # Container-internal path, not a host path: rootless buildkitd writes its
            # state to $HOME/.local/share/buildkit inside the image, and needs it
            # writable. Not a self-containment violation.
            - name: buildkitd
              mountPath: /home/user/.local/share/buildkit
            - name: docker-config
              mountPath: /docker-config
              readOnly: true
      volumes:
        - name: src
          emptyDir: {}
        - name: meta
          emptyDir: {}
        - name: buildkitd
          emptyDir: {}
        - name: docker-config
          secret:
            secretName: __PUSH_SECRET__
            items:
              - key: .dockerconfigjson
                path: config.json
